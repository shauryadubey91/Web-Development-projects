<!DOCTYPE html>
<html>
<head>
    <title>Div and Span</title>
    <style>
        .box {
            width: 300px;
            background-color: lightgray;
            padding: 20px;
            margin: 10px;
        }

        .text {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="box">
    This is a div block element.
    <span class="text">This is span inline element.</span>
</div>

</body>
</html>
