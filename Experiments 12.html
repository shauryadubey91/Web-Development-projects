<!DOCTYPE html>
<html>
<head>
    <title>Conditions & Loops</title>
</head>
<body>

<script>
let num = 5;

if (num % 2 == 0) {
    document.write("Even Number<br>");
} else {
    document.write("Odd Number<br>");
}

document.write("For Loop: ");
for (let i = 1; i <= 5; i++) {
    document.write(i + " ");
}
document.write("<br>");

let j = 1;
document.write("While Loop: ");
while (j <= 5) {
    document.write(j + " ");
    j++;
}
document.write("<br>");

let k = 1;
document.write("Do While Loop: ");
do {
    document.write(k + " ");
    k++;
} while (k <= 5);
</script>

</body>
</html>
