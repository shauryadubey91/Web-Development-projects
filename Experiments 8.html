<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>
    <style>
        * {
            font-family: Arial;
        }

        #main {
            color: red;
        }

        .highlight {
            background-color: yellow;
        }

        div p {
            color: blue;
        }

        h1, h2, h3 {
            text-align: center;
        }
    </style>
</head>
<body>

<h1>CSS Selectors</h1>

<p id="main">This uses ID selector</p>

<p class="highlight">This uses class selector</p>

<div>
    <p>This uses descendant selector</p>
</div>

</body>
</html>
