<!DOCTYPE html>
<html>
<head>
    <title>Links, Images & Lists</title>
</head>
<body>

<h2>HTML Link</h2>
<a href="https://www.google.com" target="_blank">Go to Google</a>

<h2>Image</h2>
<img height="200" src="shaurya.jpeg" alt="Image">

<h2>Unordered List</h2>
<ul>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
</ul>

<h2>Ordered List</h2>
<ol>
    <li>C Language</li>
    <li>Python</li>
    <li>Java</li>
</ol>

<h2>Nested List</h2>
<ul>
    <li>Frontend
        <ul>
            <li>HTML</li>
            <li>CSS</li>
        </ul>
    </li>
    <li>Backend
        <ul>
            <li>Python</li>
            <li>Java</li>
        </ul>
    </li>
</ul>
</body>
</html>
