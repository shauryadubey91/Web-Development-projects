<!DOCTYPE html>
<html>
<body>
        
<canvas id="myCanvas" width="300" height="200"
        style="border:1px solid black;"></canvas>

<script>
let canvas = document.getElementById("myCanvas");
let ctx = canvas.getContext("2d");
//Rectangle 
ctx.fillStyle = "blue";
ctx.fillRect(20, 20, 100, 50);
//circle
ctx.beginPath();
ctx.arc(200, 80, 30, 0, 2 * Math.PI);
ctx.fillStyle = "red";
ctx.fill();

//Line 
ctx.beginPath();
ctx.moveTo(20, 150);
ctx.lineTo(280, 150);
ctx.stroke();
</script>

</body>
</html>
