<!DOCTYPE html>
<html>
<head>
    <title>Responsive Design</title>
    <style>
        body {
            font-size: 16px;
        }

        .container {
            width: 90%;
            margin: auto;
            background-color: lightblue;
            padding: 1em;
        }

        @media (min-width: 600px) {
            body {
                font-size: 18px;
            }
        }

        @media (min-width: 900px) {
            body {
                font-size: 20px;
            }
            .container {
                width: 60%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Responsive Web Page</h2>
    <p>This page adjusts according to screen size.</p>
</div>

</body>
</html>
